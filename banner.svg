<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Smart Hospital Management and Emergency Response System. Animated heartbeat banner." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Smart Hospital Management and Emergency Response System</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2f"/><stop offset="0.6" stop-color="#0b2a4a"/><stop offset="1" stop-color="#0a4b5c"/></linearGradient>
 <linearGradient id="ecg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f9d9a" stop-opacity="0.2"/><stop offset="0.5" stop-color="#3be0d6"/><stop offset="1" stop-color="#7ff5ec"/></linearGradient>
 <filter id="glow" x="-5%" y="-40%" width="110%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/></pattern>
 <style>
  .draw{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw 4s linear infinite}
  .head{stroke-dasharray:0.025 2;stroke-dashoffset:0.025;animation:head 4s linear infinite}
  @keyframes draw{0%{stroke-dashoffset:1;opacity:1}72%{stroke-dashoffset:0;opacity:1}90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
  @keyframes head{0%{stroke-dashoffset:0.025;opacity:1}72%{stroke-dashoffset:-0.975;opacity:1}73%{opacity:0}100%{stroke-dashoffset:-0.975;opacity:0}}
  .ring{transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
  .ring.r2{animation-delay:0.8s}
  @keyframes ring{0%{transform:scale(0.7);opacity:0.7}100%{transform:scale(1.55);opacity:0}}
  .beat{transform-box:fill-box;transform-origin:center;animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(1)}36%{transform:scale(1.08)}48%{transform:scale(1)}}
  .tag{opacity:0;animation:tag 12s ease-in-out infinite}
  .t2{animation-delay:3s}.t3{animation-delay:6s}.t4{animation-delay:9s}
  @keyframes tag{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}26%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
  .blink{animation:blink 1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
 </style>
</defs>
<rect width="1200" height="320" rx="18" fill="url(#bg)"/>
<rect width="1200" height="320" rx="18" fill="url(#grid)"/>
<!-- pulsing medical icon -->
<g transform="translate(100,112)">
 <circle class="ring" r="38" fill="none" stroke="#3be0d6" stroke-width="2.5"/>
 <circle class="ring r2" r="38" fill="none" stroke="#3be0d6" stroke-width="2.5"/>
 <g class="beat"><circle r="38" fill="#0f9d9a"/><rect x="-6.5" y="-21" width="13" height="42" rx="3" fill="#fff"/><rect x="-21" y="-6.5" width="42" height="13" rx="3" fill="#fff"/></g>
</g>
<!-- title -->
<text x="170" y="102" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="0.5">Smart Hospital Management</text>
<text x="172" y="134" font-size="19" font-weight="600" fill="#7ff5ec" letter-spacing="3">&amp; EMERGENCY RESPONSE SYSTEM</text>
<!-- rotating taglines -->
<g font-size="22" fill="#dbe9f6">
 <text class="tag t1" x="172" y="172">4 role-based portals: patient, doctor, nurse, admin</text>
 <text class="tag t2" x="172" y="172">Priority emergency queue: Level 1 is always seen first</text>
 <text class="tag t3" x="172" y="172">Insurance billing + downloadable PDF invoices</text>
 <text class="tag t4" x="172" y="172">Simulated payments: no real money, ever</text>
</g>
<!-- ECG line -->
<path d="M0,262 L80,262 Q98,248 116,262 L142,262 L150,276 L166,196 L182,296 L194,262 L218,262 Q246,236 274,262 L300,262 L380,262 Q398,248 416,262 L442,262 L450,276 L466,196 L482,296 L494,262 L518,262 Q546,236 574,262 L600,262 L680,262 Q698,248 716,262 L742,262 L750,276 L766,196 L782,296 L794,262 L818,262 Q846,236 874,262 L900,262 L980,262 Q998,248 1016,262 L1042,262 L1050,276 L1066,196 L1082,296 L1094,262 L1118,262 Q1146,236 1174,262 L1200,262 L1200,262" pathLength="1" fill="none" stroke="#3be0d6" stroke-opacity="0.12" stroke-width="3" stroke-linejoin="round"/>
<path class="draw" d="M0,262 L80,262 Q98,248 116,262 L142,262 L150,276 L166,196 L182,296 L194,262 L218,262 Q246,236 274,262 L300,262 L380,262 Q398,248 416,262 L442,262 L450,276 L466,196 L482,296 L494,262 L518,262 Q546,236 574,262 L600,262 L680,262 Q698,248 716,262 L742,262 L750,276 L766,196 L782,296 L794,262 L818,262 Q846,236 874,262 L900,262 L980,262 Q998,248 1016,262 L1042,262 L1050,276 L1066,196 L1082,296 L1094,262 L1118,262 Q1146,236 1174,262 L1200,262 L1200,262" pathLength="1" fill="none" stroke="url(#ecg)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
<path class="head" d="M0,262 L80,262 Q98,248 116,262 L142,262 L150,276 L166,196 L182,296 L194,262 L218,262 Q246,236 274,262 L300,262 L380,262 Q398,248 416,262 L442,262 L450,276 L466,196 L482,296 L494,262 L518,262 Q546,236 574,262 L600,262 L680,262 Q698,248 716,262 L742,262 L750,276 L766,196 L782,296 L794,262 L818,262 Q846,236 874,262 L900,262 L980,262 Q998,248 1016,262 L1042,262 L1050,276 L1066,196 L1082,296 L1094,262 L1118,262 Q1146,236 1174,262 L1200,262 L1200,262" pathLength="1" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
<text x="1174" y="34" text-anchor="end" font-size="13" fill="#9fb8cf">Demo project · Python · Flask · SQLite</text>
</svg>