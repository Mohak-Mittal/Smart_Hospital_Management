{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block public %}<div class="container"><div class="card auth-card" style="max-width:560px"><div class="card-body p-4">
  <h1 class="h4 mb-3">Create a patient account</h1>
  <form method="post" novalidate>{{ form.hidden_tag() }}
    {% for f in form if f.type not in ('CSRFTokenField','SubmitField') %}{{ m.field(f) }}{% endfor %}
    <button class="btn btn-primary w-100" type="submit">Create account</button></form>
  <p class="mt-3 mb-0 small">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</div></div></div>{% endblock %}
